name: Proponer una mejora
description: Propón una función con alcance, riesgos y criterio de aceptación.
title: '[Mejora] '
labels: ['enhancement']
body:
  - type: textarea
    id: need
    attributes:
      label: Problema y utilidad
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance, riesgos y alternativas
      description: Explica permisos, datos tratados y cómo comprobarlo sin dañar sistemas.
    validations:
      required: true
