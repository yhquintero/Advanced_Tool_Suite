name: Validacion de Advanced Tool Suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python packaging/Build-Site-Catalog.py --check
      - run: python packaging/Check-Repository.py
      - run: python packaging/Build-Bootstrap.py
      - run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sintaxis y catalogo (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Validar-PowerShell.ps1
      - name: Contratos sin cambios de sistema
        shell: powershell
        run: .\tests\Probar-Contratos.ps1
      - name: Contratos declarativos de plugins
        shell: powershell
        run: .\tests\Probar-Plugins.ps1
      - name: Validar y extraer el unico fichero en un destino temporal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:TEMP ('ATS-bootstrap-CI-' + [guid]::NewGuid().ToString('N'))
          try {
            & .\Releases\AdvancedToolSuite-v4.0.0-setup.ps1 -ValidateOnly
            & .\Releases\AdvancedToolSuite-v4.0.0-setup.ps1 -Destination $target -WhatIf
            if (Test-Path $target) { throw 'WhatIf creo el destino.' }
            & .\Releases\AdvancedToolSuite-v4.0.0-setup.ps1 -Destination $target
            & (Join-Path $target 'Tool\AdvancedToolSuite.ps1') -ValidateOnly
          } finally { if (Test-Path $target) { Remove-Item $target -Recurse -Force } }
      - name: Instalar Pester fijado para CI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force
      - name: Pester - exigir 43 casos aprobados
        shell: powershell
        run: .\tests\Run-Pester.ps1
      - name: Crear controles WPF sin mostrar ventanas ni ejecutar herramientas
        shell: powershell
        run: powershell.exe -NoProfile -STA -File .\Tool\AdvancedToolSuite.ps1 -SmokeTest
      - name: Empaquetado portable
        shell: powershell
        run: .\packaging\Build-Release.ps1 -Format Portable
      - name: Conservar informe Pester
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ATS-Pester-Windows
          path: artifacts/tests/ATS-Pester.xml
          if-no-files-found: warn
